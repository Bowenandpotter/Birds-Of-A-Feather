<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birds Of A Feather · 一路同行</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 顶部导航栏（英文大写 + 中文小字） ===== -->
  <header class="topbar">
    <div class="topbar-inner">

      <!-- 品牌区：点它回到首页 -->
      <a class="brand" href="#/">
        <img class="brand-mark" src="assets/favicon.svg" alt="" width="26" height="26">
        <span class="brand-text">
          <strong>Birds Of A Feather</strong>
          <small>一路同行</small>
        </span>
      </a>

      <!-- 主导航：5 个栏目 -->
      <nav class="nav" id="nav">
        <a href="#/"         data-nav="home">     <span class="nav-en">Home</span>     <span class="nav-cn">首页</span></a>
        <a href="#/memories" data-nav="memories"> <span class="nav-en">Memories</span> <span class="nav-cn">回忆</span></a>
        <a href="#/journal"  data-nav="journal">  <span class="nav-en">Journal</span>  <span class="nav-cn">日记</span></a>
        <a href="#/letters"  data-nav="letters">  <span class="nav-en">Letters</span>  <span class="nav-cn">信件</span></a>
        <a href="#/words"    data-nav="words">    <span class="nav-en">Words</span>    <span class="nav-cn">想说的话</span></a>
      </nav>

      <!-- 设置入口 -->
      <a class="nav-gear" href="#/settings" data-nav="settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
             stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
        </svg>
      </a>

    </div>
  </header>

  <!-- ===== 页面内容：由 js/app.js 根据网址里的 # 号动态渲染 ===== -->
  <main id="app" class="page"></main>

  <!-- ===== 照片灯箱：点击首页照片时全屏放大 ===== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片放大查看" hidden>
    <button type="button" class="lb-close" id="lbClose" aria-label="关闭">&times;</button>
    <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="上一张">&#8249;</button>
    <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="下一张">&#8250;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption class="lb-caption">
        <span class="lb-index" id="lbIndex"></span>
        <span class="lb-text" id="lbText"></span>
      </figcaption>
    </figure>
  </div>

  <!-- ===== 确认对话框：删除记录、导入备份之前都要先经过这里 ===== -->
  <div class="confirm" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
    <div class="confirm-box">
      <span class="eyebrow" id="dialogKicker"></span>
      <h2 class="confirm-title" id="dialogTitle"></h2>
      <div class="confirm-text" id="dialogText"></div>
      <div class="confirm-actions" id="dialogActions"></div>
    </div>
  </div>

  <!-- ===== 隐藏的文件选择器：用于"从备份恢复" ===== -->
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <!-- ===== 底部提示条（点"功能开发中"的按钮时会冒出来） ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
